---
# The team's own Postgres + Redis, entirely separate from Roy's dev stack (docker-compose.yml
# at the repo root, ports 5432/6379) and from production (Neon — the team can't reach it at
# all; NIMBLE_API_KEY and DATABASE_URL both get scrubbed before a cycle runs, per
# run-cycle.sh). Brought up under its own compose project name (`crate-team`, see
# sandbox-db.sh) so `docker compose down` here can never touch the other stack's containers.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: crate
      POSTGRES_PASSWORD: crate
      POSTGRES_DB: crate_team
    ports:
      - "55432:5432"
    volumes:
      - crate_team_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crate -d crate_team"]
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  crate_team_pgdata:
