services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: crate
      POSTGRES_PASSWORD: crate
      POSTGRES_DB: crate
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crate"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot: bring the schema to head, then exit. api/worker wait for it.
  migrate:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://crate:crate@postgres:5432/crate
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    build: ./backend
    env_file: .env
    environment:
      # Override compose-internal hosts (the .env values point at localhost/@postgres).
      DATABASE_URL: postgresql+asyncpg://crate:crate@postgres:5432/crate
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  worker:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://crate:crate@postgres:5432/crate
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # ARQ worker: drains the crawl frontier (seed/enqueue via scripts.crawl or the
    # seed_crawl job). Idle until work is enqueued — it won't crawl on its own.
    command: ["arq", "app.worker.WorkerSettings"]
    restart: unless-stopped

# ── Dev override (live code reload) ──────────────────────────────────────────
# The services above run the baked image (a real deployable — no host source
# needed). For local development with live reload, run:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# which bind-mounts ./backend and adds uvicorn --reload.

volumes:
  pgdata:
