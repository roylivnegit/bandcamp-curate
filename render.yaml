# Render Blueprint — two free EU (Frankfurt) services:
#   crate-digger-api       Docker, the FastAPI JSON API reading Neon
#   crate-digger-web       static, the React app that talks to it
# One-time: push this repo to GitHub, then Render → New → Blueprint → pick the
# repo. Render reads this file and deploys both.
#
# The API only READS Neon (serves the feed + recompute) — no Nimble key, no
# Redis. Crawling stays on your Mac (writes to Neon). Set DATABASE_URL in the
# Render dashboard (sync:false = not stored in git): paste Neon's DIRECT (non-
# pooled) connection URL, e.g.
#   postgresql://neondb_owner:...@ep-xxx.eu-central-1.aws.neon.tech/neondb?sslmode=require
#
# Auth: AUTH_SECRET_KEY is generated by Render (never in git). AUTH_INVITE_CODE
# gates signup — pick one in the dashboard and share it only with people you
# want queueing crawls, since every scan runs on YOUR Mac against YOUR Nimble
# credits. Leaving it unset disables signup entirely.
#
# Note the deploy also runs `alembic upgrade head` (see backend/Dockerfile), so
# schema migrations apply automatically on release.
#
# Free plan spins the service down after ~15 min idle; the first request after
# that cold-starts (~30–60s) and also wakes Neon (~1s). Fine for a personal feed.
services:
  - type: web
    name: crate-digger-api
    runtime: docker
    region: frankfurt
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL   # Neon DIRECT url — set in dashboard, not in git
        sync: false
      - key: BANDCAMP_FAN_URL  # legacy operator seed; per-user urls live on `users`
        sync: false
      - key: AUTH_SECRET_KEY   # JWT signing key — Render generates it, never in git
        generateValue: true
      - key: AUTH_INVITE_CODE  # required at signup — set in dashboard
        sync: false
      # CORS: only this origin may call the API. Must be scheme-qualified
      # (https://crate-digger-web-xxxx.onrender.com) — an Origin header always
      # carries the scheme. Can't use fromService: it yields a bare host, and a
      # blank value here would override the config default and break CORS, so
      # set it in the dashboard once the web service below has its URL.
      - key: FRONTEND_ORIGIN
        sync: false

  # ── the React app ─────────────────────────────────────────────────────────
  # Static build; `rewrites` sends unknown paths to index.html so client-side
  # routes (/login, /scans/3) survive a refresh or a shared link instead of 404ing.
  - type: web
    name: crate-digger-web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    autoDeploy: true
    envVars:
      # The API's origin, scheme included — it's concatenated onto request paths.
      # Dashboard-set for the same reason as FRONTEND_ORIGIN above. Baked in at
      # build time (Vite inlines VITE_* vars), so changing it needs a redeploy.
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
